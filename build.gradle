// ===== 作者编译契约 jar（可选发布物）=====
// 目的：给 mod 作者一个**小而稳定**的编译期依赖面 —— 只含 org.abstruck.brush.api.**，不含 impl
// （不含 L1 transform/、不含加载器内部 mod/ launch/ host/ ui/）。
// 其中一部分 api 类住在库模组（网络引擎）。**缺库模组产物时明确跳过并说明**（不是静默、也不再让
// `gradlew build` 失败）：本体 jar 完全不依赖契约 jar —— 2026-10-16 用户报 `gradlew build` 在
// 只构建加载器时报 "Brush API jar not found"，根因就是这条把**另一个项目的产物**设成了必需依赖。
tasks.register('apiContractJar', Jar) {
    group = 'brush'
    description = 'Package the mod-author compile contract (only org.abstruck.brush.api.**, excluding impl; skipped when the Brush API jar is absent)'
    dependsOn 'classes'
    archiveFileName = 'brush-api-contract.jar'
    destinationDirectory.set(layout.buildDirectory.dir('libs'))
    from(sourceSets.main.output) {
        include 'org/abstruck/brush/api/**'
    }
    from({ zipTree(brushApiJar.singleFile) }) {
        include 'org/abstruck/brush/api/**'
        exclude 'org/abstruck/brush/api/impl/**'
    }
    // onlyIf 而非 doFirst 抛错：缺件时按"可选产物"语义跳过，并把原因与两条出路打到控制台。
    // 写法注意（本仓踩过三次的 Groovy 坑）：续行**不得以 `+` 开头**（会被解析成一元正号 →
    // No signature of method: java.lang.String.positive()），故把 `+` 放在行尾。
    onlyIf {
        def jar = brushApiJar.singleFile
        boolean present = jar.isFile()
        if (!present) {
            println "[brush] apiContractJar SKIPPED -- Brush API jar not found at ${jar} ; " +
                    "the loader jar does not need it. To also produce the contract jar: build the " +
                    "Brush API project (cd \"../Brush API\" && gradlew.bat jar " +
                    "-PbrushCoreJar=<this project>/build/libs/Brush-<version>.jar), or pass " +
                    "-PbrushApiJar=<path to brush-api.jar>."
        }
        present
    }
    doLast {
        // 机械校验：产物里**只能**有 api 包下的条目，且**不得含 impl 实现**
        def jar = archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jar)
        try {
            def bad = java.util.Collections.list(zip.entries()).findAll { e ->
                !e.directory && e.name != 'META-INF/MANIFEST.MF'
                        && (!e.name.startsWith('org/abstruck/brush/api/')
                            || e.name.startsWith('org/abstruck/brush/api/impl/'))
            }
            if (!bad.isEmpty()) {
                throw new GradleException("apiContractJar must contain only"
                        + " org/abstruck/brush/api/** (no impl) but found: ${bad.take(5)*.name}")
            }
            println "[brush] api contract jar: ${jar.name} (${zip.size()} entries, api package only)"
        } finally {
            zip.close()
        }
    }
}

// ===== 宿主 harness 工具 jar（2026-10-16 按用户指示新增）=====
// 为什么单独发一个 jar：Fabric / NeoForge 的宿主装配逻辑（FabricHostHarness / NeoForgeHostHarness
// 及其 profile）住在 src/tools，**不在加载器本体 jar 里**。MDK 与 Brush API 项目要做到"整个文件夹
// 拷到别的设备也能跑 S2/S3"，就得把这份工具一起带上。它只依赖加载器的 launch/**（在本体 jar 内）
// 与 gson/log4j，不引用 MC 类型，也不含任何第三方二进制。
tasks.register('toolsJar', Jar) {
    group = 'brush'
    description = 'Package the host harnesses (Fabric / NeoForge) so a jar-only MDK can run S2/S3'
    dependsOn 'toolsClasses'
    archiveFileName = 'brush-tools.jar'
    destinationDirectory.set(layout.buildDirectory.dir('libs'))
    from(sourceSets.tools.output)
}

tasks.named('assemble') {
    dependsOn 'apiContractJar'
    dependsOn 'toolsJar'
}

// 保留的宿主安装工具也纳入 check（避免它悄悄腐坏）
tasks.named('check') {
    dependsOn 'compileToolsJava'
}

// ===== 发布（maven-publish，2026-10-16 按用户要求新增）=====
// 默认只发到**本地目录** build/repo（不碰任何远程、不需要凭据）；要发到远程仓库就显式传属性：
//   -Pbrush.publishUrl=<https://…/repository/…>  [-Pbrush.publishUsername=… -Pbrush.publishPassword=…]
// 坐标：group = org.abstruck.brush（project.group）/ artifactId = brush / version = gradle.properties 的 loaderVersion
// 产物：本体 jar（components.java）+ 宿主 harness 工具 jar（classifier = tools）
// 也可以 `gradlew.bat publishToMavenLocal` 装进本机 ~/.m2 供本地联调。
apply plugin: 'maven-publish'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'brush'
            artifact(tasks.named('toolsJar')) {
                classifier = 'tools'
            }
            pom {
                name = 'Brush'
                description = 'Brush —— 自研 Minecraft 26.1.2 模组加载器（一个 mod jar 跑三种运行时）'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License v2.1 or later'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'brushLocal'
            url = project.hasProperty('brush.publishUrl')
                    ? uri(project.property('brush.publishUrl'))
                    : layout.buildDirectory.dir('repo')
            if (project.hasProperty('brush.publishUsername')) {
                credentials {
                    username = project.property('brush.publishUsername')
                    password = project.property('brush.publishPassword')
                }
            }
        }
    }
}
