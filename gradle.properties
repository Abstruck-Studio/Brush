# ===== 构建 JDK：不写死本机路径（2026-10-16 按用户指示修订）=====
# 此前这里写死 org.gradle.java.home=D:/.jdks/ms-25.0.4.1 —— 换台电脑就构建不了。
# 现在改由 Gradle Java toolchain 负责：build.gradle 声明
#     java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
# settings.gradle 挂了 foojay-resolver-convention ⇒ 本机没有 JDK 25 时，Gradle 会**自动下载到
# Gradle 缓存**（不碰系统环境、不碰 D:/.jdks）。Gradle 自身跑在哪个 JDK 上无所谓（17 即可）。
# 需要指定某个已装好的 JDK 时（两种都不写进仓库）：
#   ① 一次性：  gradlew.bat build -Dorg.gradle.java.home=<JDK 25 路径>
#   ② 本机长期：在 %USERPROFILE%\.gradle\gradle.properties 写 org.gradle.java.home=<JDK 25 路径># 控制台编码策略（2026-10-07 P1.3 实测定位）：
# 脚本读取层无误（JDK 21 默认 UTF-8）；乱码发生在 daemon 的 stdout —— 中文 Windows 上按 GBK 写出，
# 在 UTF-8 终端（Git Bash / CI）显示为乱码，反之强制 UTF-8 又会在 GBK 的 cmd 里乱。
# 因此约定：**构建工具的控制台输出一律纯 ASCII**（任务描述用英文），中文只出现在源码注释与 docs/。
# 显式给出内存参数，避免设置 jvmargs 后丢失 Gradle 默认内存（docs/00 §6.4）
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# ===== 版本单一来源（C.3，2026-10-12）=====
# build.gradle 的 version / 各任务的 --version 参数 / vanillaJar 路径 / brush-build.properties
# （构建期展开，打包进类路径）全部读这两个值；代码侧经 org.abstruck.brush.launch.BuildProperties
# 读取（其 FALLBACK_* 回退值须与此同步修改）。改动这里 = 全仓版本口径变更。
mcVersion=26.1.2
loaderVersion=26.10.1
# 若本机 JDK 装在 Gradle 不自动扫描的位置（例如 IntelliJ 的 D:\.jdks），设一个环境变量即可：
#   setx JDK25_HOME D:\.jdks\ms-25.0.4.1        （新开终端生效）
# 下面这行只是把该变量名告诉 Gradle —— 不含任何绝对路径，因此换机器无副作用。
org.gradle.java.installations.fromEnv=JDK25_HOME