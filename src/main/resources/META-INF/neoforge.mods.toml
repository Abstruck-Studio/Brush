# Brush —— NeoForge（S3）宿主形态的模组元数据（P7，docs/13-宿主适配-NeoForge.md）。
# 格式依据 2026-10-08 实测双模板：
#   ① NeoForge 自身：neoforge-26.1.2.114-universal.jar!META-INF/neoforge.mods.toml
#   ② 真实 mod  ：sodium-neoforge-0.9.2.jar!META-INF/neoforge.mods.toml
# 关键约束：不得带 refmap 字段（CLAUDE.md §11.2 —— NeoForge 生产环境不需要 refmap，写上会坏）。
# version 的 ${version} 由 build.gradle processResources 构建期展开（单一来源 = build.gradle 顶部 version）。
modLoader = "javafml"
loaderVersion = "[4,)"              # sodium 实证：本版（fancymodloader 11.0.15）loader API 版本 >= 4
license = "LGPL-2.1-or-later"       # 与 README / fabric.mod.json / 仓库 LICENSE 一致（2026-10-16 用户拍板：LGPL-2.1-or-later）

[[mods]]
modId = "brush"
version = "${version}"
displayName = "Brush"
description = '''Brush loader as a NeoForge host adaptation (S3): thin injection + runtime dispatch, loads brush-mods/ alongside NeoForge mods.'''

[[mixins]]
config = "brush.mixins.json"        # 与 S1/S2 共用同一份配置（官方名目标，CLAUDE.md §5.2；无 refmap）

[[dependencies.brush]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.brush]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2,)"
ordering = "NONE"
side = "CLIENT"
